<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#d8d5f5">
    <title>添加软件源</title>

    <style>
        :root {
            --text: #1d1d1f;
            --subtext: #86868b;
            --line: rgba(0, 0, 0, 0.08);
            --card: rgba(255, 255, 255, 0.78);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 8vh 16px 30px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--text);
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        .page {
            width: min(100%, 400px);
        }

        .card {
            padding: 32px 24px 24px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 26px;
            background: var(--card);
            box-shadow: 0 20px 50px rgba(40, 60, 80, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .profile {
            text-align: center;
        }

        .avatar {
            width: 76px;
            height: 76px;
            margin: 0 auto 14px;
            border-radius: 21px;
            object-fit: cover;
            background: #fff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .bio {
            margin: 7px 0 26px;
            color: var(--subtext);
            font-size: 13px;
        }

        .label {
            display: block;
            margin: 0 0 8px;
            color: var(--subtext);
            font-size: 12px;
        }

        .repo-row {
            display: flex;
            gap: 8px;
        }

        .repo-input {
            min-width: 0;
            flex: 1;
            height: 44px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            outline: none;
            color: #5f6368;
            background: rgba(248, 250, 252, 0.9);
            font-size: 12px;
        }

        .copy-button {
            height: 44px;
            padding: 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            color: #fff;
            background: #6d9eb2;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .copy-button:active {
            transform: scale(0.95);
            opacity: 0.85;
        }

        .installers {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 18px;
        }

        .installer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 82px;
            padding: 9px 4px;
            border: 1px solid transparent;
            border-radius: 14px;
            color: #68737c;
            background: rgba(255, 255, 255, 0.32);
            font-size: 11px;
            font-weight: 500;
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .installer:active {
            transform: scale(0.95);
        }

        .installer:hover,
        .installer:focus-visible {
            border-color: var(--line);
            background: rgba(255, 255, 255, 0.72);
        }

        .installer img {
            width: 34px;
            height: 34px;
            object-fit: contain;
            border-radius: 9px;
        }

        .contact {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            text-align: center;
            color: var(--subtext);
            font-size: 12px;
            line-height: 1.65;
        }

        .contact-title {
            color: var(--text);
            font-weight: 600;
        }

        .contact-number {
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            padding: 9px 15px;
            border-radius: 99px;
            color: #fff;
            background: rgba(30, 30, 30, 0.82);
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 390px) {
            body {
                padding-top: 5vh;
            }

            .card {
                padding: 28px 18px 22px;
            }

            .repo-row {
                display: grid;
                grid-template-columns: 1fr auto;
            }

            .repo-input {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="card">

            <div class="profile">
                <img class="avatar" src="./CydiaIcon.png" alt="源图标">
                <h1>添加软件源</h1>
                <p class="bio">不允许 你被别人发现 :D</p>
            </div>

            <label class="label" for="repo-url">源地址</label>

            <div class="repo-row">
                <input
                    class="repo-input"
                    id="repo-url"
                    type="text"
                    value="https://yaowell.github.io/b4by/"
                    readonly
                >

                <button
                    class="copy-button"
                    id="copy-repo"
                    type="button"
                >
                    复制
                </button>
            </div>

            <div class="installers" aria-label="添加到包管理器">

                <a
                    class="installer"
                    href="sileo://source/https://yaowell.github.io/b4by/"
                >
                    <img src="icon/sileo.png" alt="Sileo">
                    <span>Sileo</span>
                </a>

                <a
                    class="installer"
                    href="irisin://repository/add?url=https%3A%2F%2Fyaowell.github.io%2Fb4by%2F"
                >
                    <img src="icon/irisin.png" alt="Irisin">
                    <span>Irisin</span>
                </a>

                <a
                    class="installer"
                    href="zbra://sources/add/https://yaowell.github.io/b4by/"
                >
                    <img src="icon/zebra.png" alt="Zebra">
                    <span>Zebra</span>
                </a>

                <a
                    class="installer"
                    href="cydia://url/https://cydia.saurik.com/api/share#?source=https://yaowell.github.io/b4by/"
                >
                    <img src="icon/cydia.png" alt="Cydia">
                    <span>Cydia</span>
                </a>

            </div>

            <div class="contact">
                <span class="contact-title">个人源 · 有问题联系</span><br>
                QQ / WeChat<br>
                <span class="contact-number">280442219</span>
            </div>

        </section>

    </main>

    <div class="toast" id="toast">
        源地址已复制
    </div>

    <script>
        const copyButton = document.getElementById('copy-repo');
        const repoInput = document.getElementById('repo-url');
        const toast = document.getElementById('toast');

        let toastTimer;

        copyButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(repoInput.value);
            } catch (error) {
                repoInput.select();
                document.execCommand('copy');
                repoInput.setSelectionRange(0, 0);
            }

            toast.classList.add('show');

            clearTimeout(toastTimer);

            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 1600);
        });
    </script>

</body>
</html>
