<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#101319">
    <title>b4by · yaowell</title>

    <style>
        :root {
            --text: #f2f3f5;
            --subtext: #8a919e;
            --card-bg: rgba(20, 23, 30, 0.75);
            --line: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(10, 13, 18, 0.55);
            --accent: #719eae;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100vh;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            color: var(--text);
            background:
                radial-gradient(circle at 20% 15%, rgba(92, 82, 150, 0.25), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(65, 110, 155, 0.25), transparent 45%),
                linear-gradient(135deg, #0b0e14 0%, #131722 50%, #0d121b 100%);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
        }

        /* 背景微光呼吸动画 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(113, 158, 174, 0.08), transparent 60%);
            pointer-events: none;
        }

        .page {
            width: min(100%, 390px);
        }

        /* 核心卡片排版 */
        .card {
            position: relative;
            padding: 32px 24px 24px;
            border: 1px solid var(--line);
            border-radius: 32px;
            background: var(--card-bg);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
        }

        /* 个人信息区：居中对齐、完美间距 */
        .profile {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
        }

        .avatar-wrap {
            position: relative;
            margin-bottom: 16px;
        }

        .avatar {
            width: 82px;
            height: 82px;
            border-radius: 24px;
            object-fit: cover;
            background: #111;
            box-shadow: 
                0 12px 30px rgba(0, 0, 0, 0.35),
                0 0 0 1.5px rgba(255, 255, 255, 0.12);
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .bio {
            margin-top: 6px;
            color: var(--subtext);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* 输入与操作区排版 */
        .section-group {
            margin-bottom: 20px;
        }

        .label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #858c98;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 0 4px;
        }

        .repo-row {
            display: flex;
            gap: 8px;
        }

        .repo-input {
            min-width: 0;
            flex: 1;
            height: 48px;
            padding: 0 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            outline: none;
            color: #c5cbd3;
            background: var(--input-bg);
            font-size: 13px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25);
        }

        .copy-button {
            height: 48px;
            padding: 0 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(135deg, #719eae 0%, #527584 100%);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 4px 12px rgba(113, 158, 174, 0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .copy-button:active {
            transform: scale(0.96);
            filter: brightness(0.9);
        }

        /* 安装程序网格排版 (2x2 或 4列自适应) */
        .installers {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .installer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            color: #9299a4;
            background: rgba(255, 255, 255, 0.03);
            font-size: 11px;
            font-weight: 500;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .installer:active {
            transform: scale(0.94);
        }

        .installer:hover {
            border-color: rgba(113, 158, 174, 0.3);
            background: rgba(113, 158, 174, 0.08);
            color: #fff;
        }

        .installer img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
        }

        /* 底部联系方式排版优化：微模块化 */
        .contact {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
            text-align: center;
            color: #858c97;
            font-size: 11px;
            line-height: 1.5;
            letter-spacing: 0.5px;
        }

        .contact-number {
            margin-top: 2px;
            color: #e3e6ea;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* 浮动提示 Toast 优化 */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            padding: 10px 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 99px;
            color: #fff;
            background: rgba(25, 28, 35, 0.92);
            font-size: 12px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 15px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* 适配超小屏幕手机 */
        @media (max-width: 360px) {
            .card {
                padding: 24px 16px 18px;
            }
            .installers {
                gap: 6px;
            }
        }
    </style>
</head>

<body>

    <main class="page">
        <section class="card">
            
            <!-- 个人信息头 -->
            <div class="profile">
                <div class="avatar-wrap">
                    <img class="avatar" src="./CydiaIcon.png" alt="b4by">
                </div>
                <h1>b4by</h1>
                <p class="bio">Heartbreak</p>
            </div>

            <!-- 源地址复制区 -->
            <div class="section-group">
                <label class="label" for="repo-url">
                    <span>Repository URL</span>
                    <span>源地址</span>
                </label>
                <div class="repo-row">
                    <input class="repo-input" id="repo-url" type="text" value="https://yaowell.github.io/b4by/" readonly>
                    <button class="copy-button" id="copy-repo" type="button">复制</button>
                </div>
            </div>

            <!-- 客户端唤醒图标网格 -->
            <div class="section-group">
                <label class="label">
                    <span>One-Click Install</span>
                    <span>快速添加</span>
                </label>
                <div class="installers" aria-label="添加到包管理器">
                    <a class="installer" href="sileo://source/https://yaowell.github.io/b4by/">
                        <img src="icon/sileo.png" alt="Sileo">
                        <span>Sileo</span>
                    </a>
                    <a class="installer" href="irisin://repository/add?url=https%3A%2F%2Fyaowell.github.io%2Fb4by%2F">
                        <img src="icon/irisin.png" alt="Irisin">
                        <span>Irisin</span>
                    </a>
                    <a class="installer" href="zbra://sources/add/https://yaowell.github.io/b4by/">
                        <img src="icon/zebra.png" alt="Zebra">
                        <span>Zebra</span>
                    </a>
                    <a class="installer" href="cydia://url/https://cydia.saurik.com/api/share#?source=https://yaowell.github.io/b4by/">
                        <img src="icon/cydia.png" alt="Cydia">
                        <span>Cydia</span>
                    </a>
                </div>
            </div>

            <!-- 底部微模块 -->
            <div class="contact">
                <span>QQ / WeChat</span>
                <span class="contact-number">280442219</span>
            </div>

        </section>
    </main>

    <div class="toast" id="toast">✓ 源地址已复制</div>

    <script>
        const copyButton = document.getElementById('copy-repo');
        const repoInput = document.getElementById('repo-url');
        const toast = document.getElementById('toast');

        let toastTimer;

        copyButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(repoInput.value);
            } catch (error) {
                repoInput.select();
                document.execCommand('copy');
                repoInput.setSelectionRange(0, 0);
            }

            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 1600);
        });
    </script>

</body>
</html>
