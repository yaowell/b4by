<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#090c12">
    <title>b4by · yaowell</title>

    <style>
        :root {
            --bg: #090c12;
            --surface: rgba(18, 24, 33, 0.65);
            --surface-hover: rgba(26, 34, 46, 0.85);
            --border: rgba(255, 255, 255, 0.07);
            --border-glow: rgba(88, 166, 255, 0.25);
            --text-main: #f0f6fc;
            --text-sub: #7d8590;
            --accent: #58a6ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100vh;
            background-color: var(--bg);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(56, 139, 253, 0.08), transparent 50%),
                linear-gradient(180deg, #090c12 0%, #040609 100%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
        }

        .container {
            width: min(100%, 380px);
            display: flex;
            flex-direction: column;
            gap: 10px; /* 紧凑的模块间距 */
        }

        /* 模块化卡片通用样式 */
        .box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 14px 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s ease;
        }

        .box:hover {
            border-color: var(--border-glow);
        }

        /* 1. 顶部身份模块：横向紧凑设计（彻底摆脱传统大头像居中） */
        .profile-box {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            object-fit: cover;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-info h1 {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 加一个小圆点在线指示器，极客范拉满 */
        .status-dot {
            width: 7px;
            height: 7px;
            background: #3fb950;
            border-radius: 50%;
            box-shadow: 0 0 8px #3fb950;
        }

        .bio {
            margin-top: 2px;
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 400;
        }

        /* 2. 复制源地址模块 */
        .source-box .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .box-title {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
        }

        .repo-row {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 3px 3px 3px 10px;
        }

        .repo-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #c9d1d9;
            font-size: 11.5px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            min-width: 0;
        }

        .copy-btn {
            background: var(--accent);
            color: #090c12;
            border: none;
            border-radius: 9px;
            padding: 7px 14px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }

        .copy-btn:active {
            transform: scale(0.94);
            opacity: 0.85;
        }

        /* 3. 快速安装模块（2x2 现代卡片网格，带有小图标和文字描述） */
        .install-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .installer-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            text-decoration: none;
            color: #fff;
            transition: all 0.2s;
        }

        .installer-card:active {
            transform: scale(0.96);
        }

        .installer-card:hover {
            background: rgba(88, 166, 255, 0.08);
            border-color: rgba(88, 166, 255, 0.25);
        }

        .installer-card img {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            object-fit: contain;
        }

        .installer-info {
            display: flex;
            flex-direction: column;
        }

        .installer-name {
            font-size: 12px;
            font-weight: 600;
            color: #f0f6fc;
        }

        .installer-desc {
            font-size: 10px;
            color: var(--text-sub);
        }

        /* 4. 底部联系方式（横向极简胶囊） */
        .footer-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            font-size: 12px;
            color: var(--text-sub);
        }

        .footer-value {
            color: #f0f6fc;
            font-weight: 600;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: 0.5px;
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translate(-50%, 20px);
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 7px 16px;
            border-radius: 99px;
            font-size: 11.5px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- 1. 顶部身份：横向紧凑胶囊，带在线指示灯 -->
        <div class="box profile-box">
            <img class="avatar" src="./CydiaIcon.png" alt="b4by">
            <div class="profile-info">
                <h1>b4by <span class="status-dot"></span></h1>
                <p class="bio">Heartbreak</p>
            </div>
        </div>

        <!-- 2. 源地址复制模块 -->
        <div class="box source-box">
            <div class="box-header">
                <span class="box-title">Repository Source</span>
            </div>
            <div class="repo-row">
                <input class="repo-input" id="repo-url" type="text" value="https://yaowell.github.io/b4by/" readonly>
                <button class="copy-btn" id="copy-repo" type="button">复制</button>
            </div>
        </div>

        <!-- 3. 快速安装：2x2 现代卡片网格，告别平铺与单一大卡 -->
        <div class="install-grid">
            <a class="installer-card" href="sileo://source/https://yaowell.github.io/b4by/">
                <img src="icon/sileo.png" alt="Sileo">
                <div class="installer-info">
                    <span class="installer-name">Sileo</span>
                    <span class="installer-desc">推荐源</span>
                </div>
            </a>
            <a class="installer-card" href="irisin://repository/add?url=https%3A%2F%2Fyaowell.github.io%2Fb4by%2F">
                <img src="icon/irisin.png" alt="Irisin">
                <div class="installer-info">
                    <span class="installer-name">Irisin</span>
                    <span class="installer-desc">快速添加</span>
                </div>
            </a>
            <a class="installer-card" href="zbra://sources/add/https://yaowell.github.io/b4by/">
                <img src="icon/zebra.png" alt="Zebra">
                <div class="installer-info">
                    <span class="installer-name">Zebra</span>
                    <span class="installer-desc">包管理器</span>
                </div>
            </a>
            <a class="installer-card" href="cydia://url/https://cydia.saurik.com/api/share#?source=https://yaowell.github.io/b4by/">
                <img src="icon/cydia.png" alt="Cydia">
                <div class="installer-info">
                    <span class="installer-name">Cydia</span>
                    <span class="installer-desc">经典源</span>
                </div>
            </a>
        </div>

        <!-- 4. 底部联系方式：独立横向小胶囊 -->
        <div class="box footer-box">
            <span>QQ / WeChat</span>
            <span class="footer-value">280442219</span>
        </div>

    </div>

    <div class="toast" id="toast">✓ 已复制源地址</div>

    <script>
        const copyButton = document.getElementById('copy-repo');
        const repoInput = document.getElementById('repo-url');
        const toast = document.getElementById('toast');
        let toastTimer;

        copyButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(repoInput.value);
            } catch (error) {
                repoInput.select();
                document.execCommand('copy');
                repoInput.setSelectionRange(0, 0);
            }

            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 1600);
        });
    </script>

</body>
</html>
