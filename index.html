<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#090a0f">
    <title>b4by · yaowell</title>

    <style>
        :root {
            --bg: #090a0f;
            --card: rgba(18, 21, 28, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f4f5f7;
            --text-sub: #8c93a0;
            --accent: #719eae;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100vh;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 20px;
            background-color: var(--bg);
            /* 更有纵深感的微光背景 */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(113, 158, 174, 0.12), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(92, 82, 150, 0.12), transparent 40%),
                linear-gradient(135deg, #090a0f 0%, #12151d 100%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
        }

        .wrapper {
            width: 100%;
            max-width: 380px;
        }

        /* 杂志风顶栏：左侧头像，右侧名字与签名（彻底告别居中） */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding: 0 4px;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            object-fit: cover;
            background: #111;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-info h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
            line-height: 1.2;
        }

        .profile-info p {
            margin-top: 4px;
            font-size: 13px;
            color: var(--text-sub);
            font-weight: 400;
        }

        /* 独立质感面板 */
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 14px;
        }

        .panel-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin-bottom: 12px;
        }

        /* 复制行排版 */
        .repo-box {
            display: flex;
            align-items: center;
            background: rgba(10, 12, 16, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 4px 4px 4px 14px;
        }

        .repo-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #d1d5db;
            font-size: 13px;
            font-family: inherit;
            min-width: 0;
        }

        .copy-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            box-shadow: 0 4px 12px rgba(113, 158, 174, 0.3);
        }

        .copy-btn:active {
            transform: scale(0.95);
            filter: brightness(0.9);
        }

        /* 快捷安装：改为现代横向胶囊/卡片流，打破网格呆板感 */
        .install-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .install-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            text-decoration: none;
            color: #fff;
            transition: all 0.2s ease;
        }

        .install-item:hover {
            background: rgba(113, 158, 174, 0.08);
            border-color: rgba(113, 158, 174, 0.25);
            transform: translateX(2px);
        }

        .install-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .install-left img {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            object-fit: contain;
        }

        .install-left span {
            font-size: 13px;
            font-weight: 600;
            color: #e5e7eb;
        }

        .install-action {
            font-size: 11px;
            color: var(--text-sub);
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 10px;
            border-radius: 6px;
        }

        /* 底部极简联系栏 */
        .footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 12px;
            font-size: 12px;
            color: var(--text-sub);
        }

        .footer-info span:last-child {
            color: #e5e7eb;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 20px);
            background: rgba(20, 23, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>

<body>

    <div class="wrapper">

        <!-- 杂志风左对齐头部 -->
        <header class="profile-header">
            <img class="avatar" src="./CydiaIcon.png" alt="b4by">
            <div class="profile-info">
                <h1>b4by</h1>
                <p>Heartbreak</p>
            </div>
        </header>

        <!-- 复制源地址面板 -->
        <div class="panel">
            <div class="panel-title">Repository Source</div>
            <div class="repo-box">
                <input class="repo-input" id="repo-url" type="text" value="https://yaowell.github.io/b4by/" readonly>
                <button class="copy-btn" id="copy-repo" type="button">复制</button>
            </div>
        </div>

        <!-- 快速添加面板（横向条目，告别传统九宫格） -->
        <div class="panel">
            <div class="panel-title">One-Click Install</div>
            <div class="install-list">
                <a class="install-item" href="sileo://source/https://yaowell.github.io/b4by/">
                    <div class="install-left">
                        <img src="icon/sileo.png" alt="Sileo">
                        <span>Sileo</span>
                    </div>
                    <span class="install-action">添加</span>
                </a>
                <a class="install-item" href="irisin://repository/add?url=https%3A%2F%2Fyaowell.github.io%2Fb4by%2F">
                    <div class="install-left">
                        <img src="icon/irisin.png" alt="Irisin">
                        <span>Irisin</span>
                    </div>
                    <span class="install-action">添加</span>
                </a>
                <a class="install-item" href="zbra://sources/add/https://yaowell.github.io/b4by/">
                    <div class="install-left">
                        <img src="icon/zebra.png" alt="Zebra">
                        <span>Zebra</span>
                    </div>
                    <span class="install-action">添加</span>
                </a>
                <a class="install-item" href="cydia://url/https://cydia.saurik.com/api/share#?source=https://yaowell.github.io/b4by/">
                    <div class="install-left">
                        <img src="icon/cydia.png" alt="Cydia">
                        <span>Cydia</span>
                    </div>
                    <span class="install-action">添加</span>
                </a>
            </div>
        </div>

        <!-- 底部信息 -->
        <div class="footer-info">
            <span>QQ / WeChat</span>
            <span>280442219</span>
        </div>

    </div>

    <div class="toast" id="toast">✓ 已复制源地址</div>

    <script>
        const copyButton = document.getElementById('copy-repo');
        const repoInput = document.getElementById('repo-url');
        const toast = document.getElementById('toast');
        let toastTimer;

        copyButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(repoInput.value);
            } catch (error) {
                repoInput.select();
                document.execCommand('copy');
                repoInput.setSelectionRange(0, 0);
            }

            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 1600);
        });
    </script>

</body>
</html>
