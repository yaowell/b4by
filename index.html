<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#e9eaf8">
    <title>b4by · 个人源</title>

    <style>
        :root {
            --text: #202124;
            --subtext: #8a8d96;
            --card: rgba(255, 255, 255, 0.70);
            --line: rgba(255, 255, 255, 0.65);
            --input: rgba(250, 251, 253, 0.72);
            --accent: #82b4c5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            padding: 13vh 16px 30px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--text);
            background: linear-gradient(
                135deg,
                #eeeafb 0%,
                #e2e7fa 45%,
                #cfe3f8 100%
            );
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "PingFang SC",
                "Helvetica Neue",
                Arial,
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        .page {
            width: min(100%, 400px);
        }

        .card {
            padding: 36px 26px 24px;
            border: 1px solid var(--line);
            border-radius: 28px;
            background: var(--card);
            box-shadow: 0 20px 55px rgba(75, 90, 120, 0.10);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        .profile {
            text-align: center;
        }

        .avatar {
            width: 78px;
            height: 78px;
            margin: 0 auto 16px;
            border-radius: 21px;
            object-fit: cover;
            background: #fff;
            box-shadow: 0 8px 22px rgba(80, 90, 110, 0.10);
        }

        h1 {
            margin: 0;
            font-size: 30px;
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .bio {
            margin: 9px 0 29px;
            color: var(--subtext);
            font-size: 14px;
            font-weight: 500;
        }

        .label {
            display: block;
            margin: 0 0 8px;
            color: #858993;
            font-size: 12px;
            font-weight: 500;
        }

        .repo-row {
            display: flex;
            gap: 9px;
        }

        .repo-input {
            min-width: 0;
            flex: 1;
            height: 46px;
            padding: 0 13px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 13px;
            outline: none;
            color: #60646c;
            background: var(--input);
            font-size: 13px;
        }

        .copy-button {
            height: 46px;
            padding: 0 17px;
            border: 0;
            border-radius: 13px;
            color: #fff;
            background: var(--accent);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .copy-button:active {
            transform: scale(0.95);
            opacity: 0.85;
        }

        .installers {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
            margin-top: 20px;
        }

        .installer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 88px;
            padding: 9px 3px;
            border: 1px solid transparent;
            border-radius: 15px;
            color: #747a83;
            background: rgba(255, 255, 255, 0.24);
            font-size: 11px;
            font-weight: 500;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .installer:active {
            transform: scale(0.95);
        }

        .installer:hover,
        .installer:focus-visible {
            background: rgba(255, 255, 255, 0.45);
        }

        .installer img {
            width: 35px;
            height: 35px;
            object-fit: contain;
            border-radius: 9px;
        }

        .contact {
            margin-top: 22px;
            padding-top: 19px;
            border-top: 1px solid rgba(0, 0, 0, 0.055);
            text-align: center;
            color: var(--subtext);
            font-size: 12px;
            line-height: 1.65;
        }

        .contact-number {
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            padding: 9px 15px;
            border-radius: 99px;
            color: #fff;
            background: rgba(35, 35, 38, 0.78);
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 390px) {
            body {
                padding-top: 8vh;
            }

            .card {
                padding: 31px 18px 24px;
            }

            .repo-row {
                display: grid;
                grid-template-columns: 1fr auto;
            }

            .repo-input {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="card">

            <div class="profile">

                <img
                    class="avatar"
                    src="./CydiaIcon.png"
                    alt="b4by"
                >

                <h1>b4by</h1>

                <p class="bio">不允许 你被别人发现:)</p>

            </div>

            <label class="label" for="repo-url">
                源地址
            </label>

            <div class="repo-row">

                <input
                    class="repo-input"
                    id="repo-url"
                    type="text"
                    value="https://yaowell.github.io/b4by/"
                    readonly
                >

                <button
                    class="copy-button"
                    id="copy-repo"
                    type="button"
                >
                    复制
                </button>

            </div>

            <div
                class="installers"
                aria-label="添加到包管理器"
            >

                <a
                    class="installer"
                    href="sileo://source/https://yaowell.github.io/b4by/"
                >
                    <img
                        src="icon/sileo.png"
                        alt="Sileo"
                    >
                    <span>Sileo</span>
                </a>

                <a
                    class="installer"
                    href="irisin://repository/add?url=https%3A%2F%2Fyaowell.github.io%2Fb4by%2F"
                >
                    <img
                        src="icon/irisin.png"
                        alt="Irisin"
                    >
                    <span>Irisin</span>
                </a>

                <a
                    class="installer"
                    href="zbra://sources/add/https://yaowell.github.io/b4by/"
                >
                    <img
                        src="icon/zebra.png"
                        alt="Zebra"
                    >
                    <span>Zebra</span>
                </a>

                <a
                    class="installer"
                    href="cydia://url/https://cydia.saurik.com/api/share#?source=https://yaowell.github.io/b4by/"
                >
                    <img
                        src="icon/cydia.png"
                        alt="Cydia"
                    >
                    <span>Cydia</span>
                </a>

            </div>

            <div class="contact">
                QQ / WeChat<br>
                <span class="contact-number">280442219</span>
            </div>

        </section>

    </main>

    <div
        class="toast"
        id="toast"
    >
        源地址已复制
    </div>

    <script>
        const copyButton = document.getElementById('copy-repo');
        const repoInput = document.getElementById('repo-url');
        const toast = document.getElementById('toast');

        let toastTimer;

        copyButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(repoInput.value);
            } catch (error) {
                repoInput.select();
                document.execCommand('copy');
                repoInput.setSelectionRange(0, 0);
            }

            toast.classList.add('show');

            clearTimeout(toastTimer);

            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 1600);
        });
    </script>

</body>
</html>
