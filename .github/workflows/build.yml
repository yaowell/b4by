name: Build and Deploy Repo Packages

on:
  workflow_dispatch:

jobs:
  build-repo:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install dpkg
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zstd

      - name: Generate Packages
        run: |
          if [ ! -d "debs" ]; then
            echo "debs directory not found"
            exit 1
          fi

          echo "Deb files:"
          find debs -type f -name "*.deb" -print

          dpkg-scanpackages -m ./debs /dev/null > Packages

          echo "AudioRecorder Control check:"
          grep -A10 -B2 "Package: com.yaowell.audiorecordercontrol" Packages || true

          bzip2 -f -k Packages
          xz -f -k Packages
          zstd -f -k Packages

      - name: Commit & Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add Packages Packages.bz2 Packages.xz Packages.zst

          if git diff --cached --quiet; then
            echo "No Packages changes."
            exit 0
          fi

          git commit -m "Auto-generated Packages"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main