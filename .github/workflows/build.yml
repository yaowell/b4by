name: Build and Deploy Repo Packages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-repo:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generate Packages
        run: |
          echo "Generating Packages files..."

      - name: Commit & Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Packages Packages.bz2 Packages.xz Packages.zst
          git commit -m "Auto-generated Packages" || echo "No changes to commit"
          git push
