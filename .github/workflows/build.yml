name: Build and Deploy Repo Packages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-repo:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generate Packages
        run: |
          if [ -d "debs" ] || [ -d "deb" ]; then
            dpkg-scanpackages -m ./debs /dev/null > Packages 2>/dev/null || true
            [ -f Packages ] && bzip2 -f -k Packages || true
            [ -f Packages ] && xz -f -k Packages || true
            [ -f Packages ] && zstd -f -k Packages || true
          fi

      - name: Commit & Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          files_to_add=""
          for f in Packages Packages.bz2 Packages.xz Packages.zst; do
            if [ -f "$f" ]; then
              files_to_add="$files_to_add $f"
            fi
          done

          if [ -n "$files_to_add" ]; then
            git add $files_to_add
            git commit -m "Auto-generated Packages" || echo "No changes to commit"
            git push
          else
            echo "No Packages files generated yet (waiting for first deb)."
          fi
